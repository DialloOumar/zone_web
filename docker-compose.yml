services:

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: zone
      POSTGRES_USER: zone_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zone_user -d zone"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"   # avoid clashing with batmex_web on 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
