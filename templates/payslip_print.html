<!DOCTYPE html>
{# A payslip alone on its page (staff.payslip_print), to print or save as a
   PDF from the browser. #}
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t['payslip.title'] }} {{ slip.label }} — {{ slip.who.name }}</title>
{% include "_payslip_style.html" %}
<style>
    @page { size: A4; margin: 1.2cm 1.3cm; }
    body { margin: 0; }
    @media screen {
        html { background: #eef1f6; }
        body { max-width: 21cm; margin: 16px auto 40px; padding: 1.2cm 1.3cm; background: #fff; border-radius: 12px;
               box-shadow: 0 1px 2px rgba(0,0,0,.28), 0 1px 3px 1px rgba(0,0,0,.10); }
        .print-toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; justify-content: flex-end;
                         margin: -1.2cm -1.3cm 20px; padding: 12px 1.3cm; border-radius: 12px 12px 0 0;
                         background: #0F74BC; color: #fff; font-size: 13px; font-family: Roboto, system-ui, "Segoe UI", sans-serif; }
        .print-toolbar__hint { margin-right: auto; font-size: 12px; color: #d4e9fb; }
        .print-toolbar a, .print-toolbar button { font: inherit; font-weight: 500; cursor: pointer; border-radius: 999px; padding: 7px 16px;
                         border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff; text-decoration: none; }
        .print-toolbar button { background: #fff; border-color: #fff; color: #0F74BC; font-weight: 700; }
    }
    @media print { .print-toolbar { display: none !important; } }
</style>
</head>
<body>
<div class="print-toolbar">
    <span class="print-toolbar__hint">{{ t['export.print_hint'] }}</span>
    <a href="{{ url_for('staff.profile', pid=slip.who.id, tab='payslip', mois='%04d-%02d' % (slip.year, slip.month)) }}">{{ t['btn.cancel'] }}</a>
    <button type="button" onclick="window.print()">{{ t['help.print'] }}</button>
</div>
{% include "_payslip_sheet.html" %}
</body>
</html>
