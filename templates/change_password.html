{% extends "base.html" %}

{% block title %}{{ t['pw.title'] }}{% endblock %}
{% block page_title %}{{ t['pw.title'] }}{% endblock %}

{% block content %}
<section class="card" style="max-width:460px;">
    <div class="card-header"><h2>{{ t['pw.title'] }}</h2></div>

    {% if error %}
    <div class="alert alert--error">{{ t[error] }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert--success">{{ t[success] }}</div>
    {% endif %}

    <form method="post" class="entry-form">
        <div class="form-group">
            <label for="current_password">{{ t['form.current_password'] }}</label>
            <input type="password" id="current_password" name="current_password" required autofocus autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="new_password">{{ t['form.new_password'] }}</label>
            <input type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirm_password">{{ t['form.confirm_password'] }}</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn--primary">{{ t['form.update_password'] }}</button>
        </div>
    </form>
</section>
{% endblock %}
