<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t['auth.login'] }} — {{ t['app.title'] }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/icon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-card">
    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="{{ t['app.title'] }}" class="auth-logo">

    {% if error %}
    <div class="alert alert--error">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
        <div class="field">
            <input type="text" id="username" name="username" placeholder=" " required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
            <label for="username">{{ t['auth.username'] }}</label>
        </div>
        <div class="field">
            <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
            <label for="password">{{ t['auth.password'] }}</label>
        </div>
        <button type="submit" class="btn btn--primary btn--block">{{ t['auth.sign_in'] }}</button>
    </form>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
