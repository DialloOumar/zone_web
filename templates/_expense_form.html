{% set is_edit = expense is not none %}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('expenses.edit', xid=expense.id) if is_edit else url_for('expenses.new') }}">
    <div class="form-row">
        <div class="field field--select">
            <select id="category" name="category" required>
                <option value="" hidden></option>
                {% set sel_cat = request.form.get('category') or (expense.category if is_edit else '') %}
                {% for c in categories %}
                <option value="{{ c }}" {% if c == sel_cat %}selected{% endif %}>{{ t['expense.cat.' + c] }}</option>
                {% endfor %}
            </select>
            <label for="category">{{ t['expense.category'] }}</label>
        </div>
        <div class="field">
            <input type="date" id="date" name="date" placeholder=" " required
                   value="{{ request.form.get('date') or (expense.date if is_edit else today) }}">
            <label for="date">{{ t['expense.date'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field field--select">
            <select id="fleet_id" name="fleet_id" required>
                <option value="" hidden></option>
                {% set sel_fleet = request.form.get('fleet_id')|int(0) or (expense.fleet_id if is_edit else preset_fleet or 0) %}
                {% for f in fleets %}
                <option value="{{ f.id }}" {% if f.id == sel_fleet %}selected{% endif %}>{{ f.name }}</option>
                {% endfor %}
            </select>
            <label for="fleet_id">{{ t['expense.fleet'] }}</label>
        </div>
        <div class="field field--select">
            <select id="vehicle_id" name="vehicle_id">
                <option value="">{{ t['expense.fleet_wide'] }}</option>
                {% set sel_v = request.form.get('vehicle_id')|int(0) or (expense.vehicle_id if is_edit else preset_vehicle or 0) %}
                {% for v in vehicles %}
                <option value="{{ v.id }}" data-fleet="{{ v.fleet_id }}" {% if v.id == sel_v %}selected{% endif %}>{{ v.code }}</option>
                {% endfor %}
            </select>
            <label for="vehicle_id">{{ t['expense.vehicle'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field">
            <input type="text" inputmode="numeric" id="amount" name="amount" placeholder="{{ t['ph.expense.amount'] }}" required
                   value="{{ request.form.get('amount') or (expense.amount if is_edit else '') }}">
            <label for="amount">{{ t['expense.amount'] }}</label>
        </div>
        <div class="field" id="field-liters">
            <input type="text" inputmode="decimal" id="liters" name="liters" placeholder="{{ t['ph.expense.liters'] }}"
                   value="{{ request.form.get('liters') or (expense.liters if is_edit and expense.liters is not none else '') }}">
            <label for="liters">{{ t['expense.liters'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field field--select">
            {% set sel_op = request.form.get('operator') or (expense.operator if is_edit and expense.operator else '') %}
            {% set op_names = operators|map(attribute='name')|list %}
            <select id="operator" name="operator">
                <option value="">{{ t['form.select'] }}</option>
                {% for o in operators %}
                <option value="{{ o.name }}" data-fleet="{{ o.fleet_id }}" {% if o.name == sel_op %}selected{% endif %}>{{ o.name }}</option>
                {% endfor %}
                {% if sel_op and sel_op not in op_names %}
                <option value="{{ sel_op }}" selected>{{ sel_op }}</option>
                {% endif %}
            </select>
            <label for="operator">{{ t['expense.operator'] }}</label>
        </div>
        <div class="field">
            <input type="text" id="supplier" name="supplier" placeholder="{{ t['ph.expense.supplier'] }}"
                   value="{{ request.form.get('supplier') or (expense.supplier if is_edit and expense.supplier else '') }}">
            <label for="supplier">{{ t['expense.supplier'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field">
            <input type="text" id="description" name="description" placeholder="{{ t['ph.expense.description'] }}"
                   value="{{ request.form.get('description') or (expense.description if is_edit and expense.description else '') }}">
            <label for="description">{{ t['expense.description'] }}</label>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('expenses.index') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>

<script>
// Narrow vehicle options to the chosen fleet, and show the litres field only
// for fuel expenses.
(function () {
    var fleetSel = document.getElementById("fleet_id");
    var vSel = document.getElementById("vehicle_id");
    var opSel = document.getElementById("operator");
    var catSel = document.getElementById("category");
    var liters = document.getElementById("field-liters");
    function narrow(sel) {
        if (!sel) return;
        var fid = fleetSel.value;
        var curOk = (sel.value === "");
        Array.prototype.forEach.call(sel.options, function (o) {
            if (!o.value || o.dataset.fleet === undefined) return;
            var ok = !fid || o.dataset.fleet === fid || o.dataset.fleet === "";
            o.hidden = !ok; o.disabled = !ok;
            if (ok && o.value === sel.value) curOk = true;
        });
        if (!curOk) sel.value = "";
    }
    function refresh() { narrow(vSel); narrow(opSel); }
    function refreshLiters() { if (liters) liters.style.display = (catSel.value === "fuel") ? "" : "none"; }
    if (fleetSel) fleetSel.addEventListener("change", refresh);
    if (catSel) catSel.addEventListener("change", refreshLiters);
    refresh();
    refreshLiters();
})();
</script>
