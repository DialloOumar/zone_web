{% set is_edit = row is not none %}
{# A unit the store counts in: its name is all there is to it. What one
   unit makes of another is a conversion, kept on the Conversions page. #}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('stock.unit_edit', uid=row.id) if is_edit else url_for('stock.unit_new') }}">
    <div class="field">
        <input type="text" id="name" name="name" placeholder="{{ t['punit.name_ph'] }}" required maxlength="40"
               value="{{ request.form.get('name') or (row.name if is_edit else '') }}">
        <label for="name">{{ t['punit.name'] }}</label>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('stock.units') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
