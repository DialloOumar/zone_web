{# When and why a contract stopped: on its planned end, or early. #}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form action="{{ url_for('staff.contract_end', cid=c.id) }}">
    <div class="form-row">
        <div class="field">
            <input type="date" id="ended_on" name="ended_on" required
                   value="{{ request.form.get('ended_on') or c.end_date or today }}">
            <label for="ended_on">{{ t['contract.ended_on'] }}</label>
        </div>
        <div class="field field--select">
            {% set sel = request.form.get('end_reason') or ('fin' if c.end_date else '') %}
            <select id="end_reason" name="end_reason" required>
                <option value=""></option>
                {% for r in reasons if r != 'renouvele' %}
                <option value="{{ r }}" {% if r == sel %}selected{% endif %}>{{ t['contract.reason.' + r] }}</option>
                {% endfor %}
            </select>
            <label for="end_reason">{{ t['contract.reason'] }}</label>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn--primary"><span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}</button>
        <a href="{{ url_for('staff.profile', pid=c.staff_id, tab='contracts') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
