{% set is_edit = entry is not none %}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('entries.edit', eid=entry.id) if is_edit else url_for('entries.new') }}">
    <div class="form-row">
        <div class="field field--select">
            <select id="vehicle_id" name="vehicle_id" required>
                <option value="" hidden></option>
                {% set sel_v = request.form.get('vehicle_id')|int(0) or (entry.vehicle_id if is_edit else preset_vehicle or 0) %}
                {% for v in vehicles %}
                <option value="{{ v.id }}" data-unit="{{ v.category.unit_type }}" data-fleet="{{ v.fleet_id }}"
                        {% if v.id == sel_v %}selected{% endif %}>{{ v.code }} — {{ v.category.label_fr if lang == 'fr' else v.category.label }}</option>
                {% endfor %}
            </select>
            <label for="vehicle_id">{{ t['entry.vehicle'] }}</label>
        </div>
        <div class="field">
            <input type="date" id="date" name="date" placeholder=" " required
                   value="{{ request.form.get('date') or (entry.date if is_edit else (preset_date or today)) }}">
            <label for="date">{{ t['entry.date'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field" id="field-trips">
            <input type="text" inputmode="numeric" id="trips" name="trips" placeholder=" "
                   value="{{ request.form.get('trips') or (entry.trips if is_edit and entry.trips is not none else '') }}">
            <label for="trips">{{ t['entry.trips'] }}</label>
        </div>
        <div class="field" id="field-hours">
            <input type="text" inputmode="decimal" id="hours" name="hours" placeholder=" "
                   value="{{ request.form.get('hours') or (entry.hours if is_edit and entry.hours is not none else '') }}">
            <label for="hours">{{ t['entry.hours'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field">
            <input type="text" inputmode="decimal" id="kilometers" name="kilometers" placeholder=" "
                   value="{{ request.form.get('kilometers') or (entry.kilometers if is_edit and entry.kilometers is not none else '') }}">
            <label for="kilometers">{{ t['entry.km'] }}</label>
        </div>
        <div class="field field--select">
            {% set sel_op = request.form.get('operator') or (entry.operator if is_edit and entry.operator else '') %}
            {% set op_names = operators|map(attribute='name')|list %}
            <select id="operator" name="operator">
                <option value="">{{ t['form.select'] }}</option>
                {% for o in operators %}
                <option value="{{ o.name }}" data-fleet="{{ o.fleet_id }}" {% if o.name == sel_op %}selected{% endif %}>{{ o.name }}</option>
                {% endfor %}
                {% if sel_op and sel_op not in op_names %}
                <option value="{{ sel_op }}" data-fleet="" selected>{{ sel_op }}</option>
                {% endif %}
            </select>
            <label for="operator">{{ t['entry.operator'] }}</label>
        </div>
    </div>

    <div class="field">
        <textarea id="note" name="note" placeholder=" " rows="1">{{ request.form.get('note') or (entry.note if is_edit else '') }}</textarea>
        <label for="note">{{ t['entry.note'] }}</label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('entries.index') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>

<script>
// Adapt the form to the selected vehicle: show the right unit field (trips
// vs hours) for its category, and restrict the conducteur list to drivers of
// that vehicle's fleet.
(function () {
    var vSel = document.getElementById("vehicle_id");
    var trips = document.getElementById("field-trips");
    var hours = document.getElementById("field-hours");
    var opSel = document.getElementById("operator");
    if (!vSel) return;
    function refresh() {
        var opt = vSel.options[vSel.selectedIndex];
        var unit = (opt && opt.dataset.unit) || "";
        var fleet = (opt && opt.dataset.fleet) || "";
        if (trips) trips.style.display = unit === "trips" ? "" : "none";
        if (hours) hours.style.display = unit === "hours" ? "" : "none";
        if (opSel) {
            Array.prototype.forEach.call(opSel.options, function (o) {
                if (!o.value) return;  // keep the placeholder
                // Hide drivers from other fleets; always keep a preserved
                // legacy value (data-fleet="") visible.
                var ok = !fleet || !o.dataset.fleet || o.dataset.fleet === fleet;
                o.hidden = !ok;
                o.disabled = !ok;
            });
            var cur = opSel.selectedOptions[0];
            if (cur && cur.hidden) opSel.value = "";  // reset if now out of scope
        }
    }
    vSel.addEventListener("change", refresh);
    refresh();
})();
</script>
