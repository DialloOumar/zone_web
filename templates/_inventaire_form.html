{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('stock.inventaire_new') }}">

    <div class="form-row">
        <div class="field field--select">
            <select id="part_id" name="part_id" required>
                <option value="" hidden></option>
                {% set sel_p = request.form.get('part_id')|int(0) or preset_part %}
                {% for p in parts %}
                <option value="{{ p.id }}" {% if p.id == sel_p %}selected{% endif %}>{{ p.name }} — {{ t['mv.on_hand'] }} {{ p.quantity | qty }}</option>
                {% endfor %}
            </select>
            <label for="part_id">{{ t['mv.part'] }}</label>
        </div>
        <div class="field">
            <input type="date" id="date" name="date" placeholder=" " required
                   value="{{ request.form.get('date') or today }}">
            <label for="date">{{ t['inventaire.date'] }}</label>
        </div>
    </div>

    <div class="field">
        <input type="number" id="quantity" name="quantity" placeholder=" " min="0" step="any" required
               value="{{ request.form.get('quantity') or '' }}">
        <label for="quantity">{{ t['inventaire.counted'] }}</label>
    </div>
    <div class="field-hint">{{ t['inventaire.hint'] }}</div>

    <div class="field">
        <input type="text" id="note" name="note" placeholder=" "
               value="{{ request.form.get('note') or '' }}">
        <label for="note">{{ t['mv.note'] }}</label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('stock.index') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
