{% set is_edit = row is not none %}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('expenses.cash_list_edit', kind=kind, row_id=row.id) if is_edit
                else url_for('expenses.cash_list_new', kind=kind) }}">

    <div class="field">
        <input type="text" id="name" name="name" placeholder=" " required
               value="{{ request.form.get('name') or (row.name if is_edit else '') }}">
        <label for="name">{{ t['list.site_name'] }}</label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('expenses.cash_lists') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
