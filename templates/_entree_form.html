{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('stock.entree_new') }}">

    <div class="form-row">
        <div class="field field--select">
            <select id="part_id" name="part_id" required data-part-prices>
                <option value="" hidden></option>
                {% set sel_p = request.form.get('part_id')|int(0) or preset_part %}
                {% for p in parts %}
                <option value="{{ p.id }}" data-price="{{ p.last_purchase_price or '' }}"
                        {% if p.id == sel_p %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
            <label for="part_id">{{ t['mv.part'] }}</label>
        </div>
        <div class="field">
            <input type="date" id="date" name="date" placeholder=" " required
                   value="{{ request.form.get('date') or today }}">
            <label for="date">{{ t['mv.date'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field">
            <input type="number" id="quantity" name="quantity" placeholder=" " min="0" step="any" required
                   value="{{ request.form.get('quantity') or '' }}">
            <label for="quantity">{{ t['entree.quantity'] }}</label>
        </div>
        <div class="field">
            <input data-money type="text" inputmode="numeric" id="unit_price" name="unit_price" placeholder=" " required
                   value="{{ request.form.get('unit_price') or '' }}">
            <label for="unit_price">{{ t['entree.unit_price'] }}</label>
        </div>
    </div>
    <div class="field-hint">{{ t['entree.hint'] }}</div>

    <div class="form-row">
        <div class="field field--select">
            <select id="payment_method" name="payment_method" required>
                <option value="" hidden></option>
                {% set sel_m = request.form.get('payment_method') %}
                {% for m in payment_methods %}
                <option value="{{ m }}" {% if m == sel_m %}selected{% endif %}>{{ t['pay.' + m] }}</option>
                {% endfor %}
            </select>
            <label for="payment_method">{{ t['expense.payment_method'] }}</label>
        </div>
        <div class="field">
            <input type="text" id="payment_reference" name="payment_reference" placeholder=" "
                   value="{{ request.form.get('payment_reference') or '' }}">
            <label for="payment_reference">{{ t['expense.payment_reference'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field">
            <input type="text" id="supplier" name="supplier" placeholder=" "
                   value="{{ request.form.get('supplier') or '' }}">
            <label for="supplier">{{ t['expense.supplier'] }}</label>
        </div>
        <div class="field">
            <input type="text" id="note" name="note" placeholder=" "
                   value="{{ request.form.get('note') or '' }}">
            <label for="note">{{ t['mv.note'] }}</label>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('stock.index') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>

{# Picking a part pre-fills the last price paid for it, leaving the field
   editable — what was actually paid today is what gets stored. #}
<script>
(function () {
    var sel = document.querySelector('[data-part-prices]');
    if (!sel) return;
    var price = document.getElementById('unit_price');
    sel.addEventListener('change', function () {
        var p = sel.options[sel.selectedIndex].dataset.price;
        if (p && !price.value) price.value = p;
    });
})();
</script>
