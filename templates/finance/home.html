{% extends "finance/base.html" %}

{% block title %}{{ t['ws.finance'] }}{% endblock %}
{% block page_title %}{{ t['ws.finance'] }}{% endblock %}

{% block content %}
<section class="card">
    <div class="card-header">
        <div>
            <h2>{{ t['finance.home_title'] }}</h2>
            <p class="muted small" style="margin:4px 0 0; max-width:60ch;">{{ t['finance.home_intro'] }}</p>
        </div>
    </div>
    <div class="empty-state empty-state--soft">
        <span class="material-symbols-outlined">visibility_off</span>
        <p>{{ t['finance.home_hidden'] }}</p>
    </div>
</section>
{% endblock %}
