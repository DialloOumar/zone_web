{% set is_edit = row is not none %}
{# A job someone holds (mécanicien, magasinier) or the department they work
   in (Logistique, Finance), by `kind`. A name and nothing else. #}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('staff.' ~ kind ~ '_edit', qid=row.id) if is_edit
                else url_for('staff.' ~ kind ~ '_new') }}">

    <div class="field">
        <input type="text" id="name" name="name" placeholder=" " required
               value="{{ request.form.get('name') or (row.name if is_edit else '') }}">
        <label for="name">{{ t['staff.' ~ kind ~ '_name'] }}</label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('staff.' ~ kind ~ 's') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
