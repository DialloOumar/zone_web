{% set is_edit = citerne is not none %}
{% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
<form method="post" class="entry-form" data-modal-form
      action="{{ url_for('carburant.citerne_edit', cid=citerne.id) if is_edit else url_for('carburant.citerne_new') }}">

    <div class="form-row">
        <div class="field">
            <input type="text" id="code" name="code" placeholder=" " required
                   value="{{ request.form.get('code') or (citerne.code if is_edit else '') }}">
            <label for="code">{{ t['citerne.code'] }}</label>
        </div>
        <div class="field">
            <input type="text" id="name" name="name" placeholder=" " required
                   value="{{ request.form.get('name') or (citerne.name if is_edit else '') }}">
            <label for="name">{{ t['citerne.name'] }}</label>
        </div>
    </div>

    <div class="form-row">
        <div class="field field--select">
            <select id="fleet_id" name="fleet_id" required>
                <option value="" hidden></option>
                {% set sel_f = request.form.get('fleet_id')|int(0) or (citerne.fleet_id if is_edit else 0) %}
                {% for f in fleets %}
                <option value="{{ f.id }}" {% if f.id == sel_f %}selected{% endif %}>{{ f.name }}</option>
                {% endfor %}
            </select>
            <label for="fleet_id">{{ t['citerne.fleet'] }}</label>
        </div>
        <div class="field">
            <input type="number" id="capacity_liters" name="capacity_liters" placeholder=" " min="1" required
                   value="{{ request.form.get('capacity_liters') or (citerne.capacity_liters if is_edit else '') }}">
            <label for="capacity_liters">{{ t['citerne.capacity'] }}</label>
        </div>
    </div>

    <div class="field">
        <input type="number" id="initial_liters" name="initial_liters" placeholder=" " min="0"
               value="{{ request.form.get('initial_liters') or (citerne.opening_stock if is_edit else '') }}">
        <label for="initial_liters">{{ t['citerne.initial'] }}</label>
    </div>
    <div class="field-hint">{{ t['citerne.initial_hint'] }}</div>

    <div class="form-actions">
        <button type="submit" class="btn btn--primary">
            <span class="material-symbols-outlined">save</span> {{ t['btn.save'] }}
        </button>
        <a href="{{ url_for('carburant.index') }}" class="btn btn--outlined" data-modal-cancel>{{ t['btn.cancel'] }}</a>
    </div>
</form>
