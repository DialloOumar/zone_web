{# The store's tools, above its catalogue: the units and the conversions
   between them. The orders live on their own page, Bons de commande. #}
{% if has_perm('stock.manage') %}
<div class="stock-settings">
    <a href="{{ url_for('stock.units') }}" class="btn btn--sm btn--outlined"
       data-modal-url="{{ url_for('stock.units') }}" data-modal-title="{{ t['punit.title'] }}">
        <span class="material-symbols-outlined">tune</span> {{ t['punit.title'] }}
    </a>
    <a href="{{ url_for('stock.conversions') }}" class="btn btn--sm btn--outlined"
       data-modal-url="{{ url_for('stock.conversions') }}" data-modal-title="{{ t['conv.title'] }}">
        <span class="material-symbols-outlined">unfold_more</span> {{ t['conv.title'] }}
    </a>
</div>
{% endif %}
